<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review</title>
<meta name="color-scheme" content="light dark">
<style>
/* Same palette and tokens as index.html -- both pages are self-contained on
   purpose, so each can be dropped anywhere on its own. DESIGN.md is the single
   source; this is a second implementation of it, not a second design. */
:root{
  --bg:oklch(1 0 0);
  --surface:oklch(0.985 0.003 260);
  --sunken:oklch(0.955 0.005 260);
  --line:oklch(0.905 0.008 260);
  --line-strong:oklch(0.82 0.012 260);
  --ink:oklch(0.24 0.02 260);
  --muted:oklch(0.45 0.018 260);
  --primary:oklch(0.48 0.155 260);
  --primary-hover:oklch(0.42 0.155 260);
  --primary-ink:oklch(1 0 0);
  --primary-wash:oklch(0.94 0.03 260);
  --danger:oklch(0.52 0.17 25);
  --radius:10px;
  --tap:44px;
  --ease:cubic-bezier(.22,1,.36,1);
  --z-toast:10;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:oklch(0.175 0.012 260);
    --surface:oklch(0.215 0.015 260);
    --sunken:oklch(0.255 0.016 260);
    --line:oklch(0.31 0.02 260);
    --line-strong:oklch(0.42 0.025 260);
    --ink:oklch(0.96 0.006 260);
    --muted:oklch(0.72 0.02 260);
    --primary:oklch(0.70 0.145 260);
    --primary-hover:oklch(0.77 0.145 260);
    --primary-ink:oklch(0.18 0.03 260);
    --primary-wash:oklch(0.30 0.045 260);
    --danger:oklch(0.72 0.15 25);
  }
}
:root[data-theme=dark]{
  --bg:oklch(0.175 0.012 260);
  --surface:oklch(0.215 0.015 260);
  --sunken:oklch(0.255 0.016 260);
  --line:oklch(0.31 0.02 260);
  --line-strong:oklch(0.42 0.025 260);
  --ink:oklch(0.96 0.006 260);
  --muted:oklch(0.72 0.02 260);
  --primary:oklch(0.70 0.145 260);
  --primary-hover:oklch(0.77 0.145 260);
  --primary-ink:oklch(0.18 0.03 260);
  --primary-wash:oklch(0.30 0.045 260);
  --danger:oklch(0.72 0.15 25);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:24px 20px 96px}
h1,h2{margin:0;font-weight:600;letter-spacing:-.011em}
h1{font-size:1.0625rem}
h2{font-size:1.25rem}
p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:38px;padding:0 14px;border:1px solid var(--line-strong);
  border-radius:var(--radius);background:var(--surface);font-size:.875rem;
  transition:background 160ms var(--ease),border-color 160ms var(--ease)}
.btn:hover{background:var(--sunken)}
.btn:active{background:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:550}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.icon{min-width:38px;padding:0 9px}

input[type=text],input[type=url]{
  min-height:38px;padding:0 12px;border:1px solid var(--line-strong);
  border-radius:var(--radius);background:var(--bg);color:var(--ink);font:inherit;font-size:.9375rem;
  transition:border-color 160ms var(--ease)}
input::placeholder{color:var(--muted);opacity:1}
input:hover{border-color:var(--muted)}
input:focus-visible{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}

/* ---- top bar ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:14px}
.brand a{color:var(--muted);font-size:.8125rem;text-decoration:none}
.brand a:hover{color:var(--ink);text-decoration:underline}
.stats{color:var(--muted);font-size:.875rem;margin-bottom:24px}
.stats b{color:var(--ink);font-weight:600}

/* ---- due today ---- */
.due-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  flex-wrap:wrap;margin-bottom:14px}
.due-head .n{color:var(--muted);font-size:.875rem}
.cards{display:flex;flex-direction:column;gap:10px;margin-bottom:36px}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  padding:16px 18px}
.card .name{font-size:1.0625rem;font-weight:550;overflow-wrap:anywhere}
.card .meta{color:var(--muted);font-size:.8125rem;margin-top:4px}
.card .notes{color:var(--muted);font-size:.875rem;margin-top:8px;overflow-wrap:anywhere;
  max-width:70ch}
.card .notes a{color:var(--primary)}
.rate{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* three equal buttons: none of these is a failure, so none is coloured as one */
.rate button{flex:1;min-width:104px;min-height:var(--tap);border:1px solid var(--line-strong);
  border-radius:var(--radius);background:var(--bg);font-size:.9375rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:background 160ms var(--ease),border-color 160ms var(--ease)}
.rate button:hover{background:var(--sunken);border-color:var(--muted)}
.rate button:active{background:var(--line)}
.rate button span{font-size:.6875rem;color:var(--muted)}

.empty{border:1px dashed var(--line-strong);border-radius:var(--radius);
  padding:28px 22px;text-align:center;color:var(--muted);max-width:56ch;margin:0 auto 36px}
.empty b{color:var(--ink);display:block;margin-bottom:6px;font-weight:600}

/* ---- add ---- */
form.add{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:36px}
form.add .topic{flex:2;min-width:190px}
form.add .notes{flex:3;min-width:190px}

/* ---- all topics ---- */
.scroll{overflow-x:auto;padding-bottom:4px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.875rem}
th{text-align:left;font-weight:600;font-size:.75rem;color:var(--muted);
  padding:0 12px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--surface)}
td.topic{overflow-wrap:anywhere;min-width:150px}
td.num{white-space:nowrap;color:var(--muted)}
td.when{white-space:nowrap}
td.when.now{color:var(--primary);font-weight:600}
.del{width:26px;height:26px;border-radius:6px;color:var(--muted);display:grid;
  place-content:center;opacity:.5;transition:opacity 140ms var(--ease),color 140ms var(--ease)}
tr:hover .del,.del:focus-visible{opacity:1}
.del:hover{color:var(--danger);background:var(--sunken)}
.del svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}

.foot{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--line);color:var(--muted);font-size:.8125rem;flex-wrap:wrap}
.foot .sp{flex:1}

.toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:var(--z-toast);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;
  font-size:.875rem;box-shadow:0 6px 24px oklch(0 0 0/.22);
  opacity:0;transition:opacity 200ms var(--ease),translate 200ms var(--ease)}
.toast.on{opacity:1;translate:-50% -6px}

@media (max-width:560px){
  .wrap{padding:18px 14px 80px}
  .rate button{min-width:0}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:1ms!important;animation-duration:1ms!important}
}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>Review</h1>
      <a href="index.html">Habits →</a>
    </div>
    <button class="btn icon" id="theme" aria-label="Switch theme" title="Switch theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" aria-hidden="true" id="theme-icon"></svg>
    </button>
  </div>

  <p class="stats" id="stats"></p>
  <main id="app"></main>

  <form class="add" id="add">
    <input class="topic" type="text" name="topic" maxlength="120" required
           placeholder="What did you learn? — e.g. TCP handshake" aria-label="Topic">
    <input class="notes" type="text" name="notes" maxlength="400"
           placeholder="Notes or a link (optional)" aria-label="Notes or source link">
    <button class="btn primary" type="submit">Add</button>
  </form>

  <section id="all"></section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
var KEY = 'review.v1', THEME_KEY = 'habits.theme', DAY = 86400000;

/* ---------- dates ------------------------------------------------------
   Integer day numbers, as in index.html: a daylight-saving shift must never
   make two calendar days look 23 or 25 hours apart and move a due date. */
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayNum(ds){ var p = ds.split('-'); return Date.UTC(+p[0], p[1] - 1, +p[2]) / DAY; }
function fromDayNum(n){ return new Date(n * DAY).toISOString().slice(0, 10); }
function addDays(ds, n){ return fromDayNum(dayNum(ds) + n); }
function daysBetween(a, b){ return dayNum(b) - dayNum(a); }

/* ---------- scheduling -------------------------------------------------
   Simplified SM-2. One interval per topic, three outcomes:
     blanked   -> back to 1 day; the material is not in there yet
     struggled -> x1.3, a small stretch
     easy      -> x2.5, the standard doubling-plus
   Capped at MAX_INTERVAL: beyond half a year the schedule stops being a
   review and starts being a coin flip. Curve from new: 1, 3, 8, 20, 50, 125, 180. */
var MAX_INTERVAL = 180;
var FACTOR = {blanked: 0, struggled: 1.3, easy: 2.5};

function nextInterval(interval, rating){
  if (rating === 'blanked') return 1;
  var f = FACTOR[rating];
  if (!f) return interval;                       // unknown rating changes nothing
  return Math.max(1, Math.min(MAX_INTERVAL, Math.round(interval * f)));
}

// Returns a NEW topic object; the caller decides whether to keep it.
function applyReview(topic, rating, today){
  var interval = nextInterval(topic.interval, rating);
  var reviews = (topic.reviews || []).concat([{date: today, rating: rating}]);
  return {
    id: topic.id, topic: topic.topic, notes: topic.notes, created: topic.created,
    interval: interval, nextDue: addDays(today, interval), reviews: reviews
  };
}

function newTopic(name, notes, today, id){
  return {
    id: id, topic: name, notes: notes || '', created: today,
    interval: 1, nextDue: addDays(today, 1), reviews: []
  };
}

function isDue(topic, today){ return dayNum(topic.nextDue) <= dayNum(today); }

function dueList(topics, today){
  return topics.filter(function(t){ return isDue(t, today); })
    .sort(function(a, b){ return dayNum(a.nextDue) - dayNum(b.nextDue); });   // most overdue first
}

// Consecutive days with at least one review, ending today. An unreviewed today
// does not break it yet -- the day is still in play.
function reviewStreak(topics, today){
  var days = {};
  topics.forEach(function(t){
    (t.reviews || []).forEach(function(r){ days[r.date] = 1; });
  });
  var n = dayNum(today);
  if (!days[fromDayNum(n)]) n--;
  var c = 0;
  while (days[fromDayNum(n)]){ c++; n--; }
  return c;
}

function summarize(topics, today){
  var due = dueList(topics, today);
  var upcoming = topics.filter(function(t){ return !isDue(t, today); })
    .sort(function(a, b){ return dayNum(a.nextDue) - dayNum(b.nextDue); });
  return {
    total: topics.length,
    due: due,
    dueCount: due.length,
    nextUp: upcoming.length ? upcoming[0] : null,
    streak: reviewStreak(topics, today),
    reviewsToday: topics.reduce(function(n, t){
      return n + (t.reviews || []).filter(function(r){ return r.date === today; }).length;
    }, 0)
  };
}

function plural(n, one, many){ return n + ' ' + (n === 1 ? one : many); }

function relDue(ds, today){
  var d = daysBetween(today, ds);
  if (d === 0) return 'today';
  if (d === 1) return 'tomorrow';
  if (d === -1) return '1 day overdue';
  if (d < 0) return (-d) + ' days overdue';
  return 'in ' + plural(d, 'day', 'days');
}

/* ---------- state ------------------------------------------------------
   ponytail: localStorage, same as the habit tracker, and separate from it --
   this page owns 'review.v1' and never touches 'habits.v1'. Export is the
   only backup, hence it ships in v1 rather than "later". */
function load(){
  try {
    var s = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(s)) return s;
  } catch (e) {}
  return [];
}

var topics = load();
var app = document.getElementById('app');

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(topics)); }
  catch (e) { toast('Could not save — ' + e.message); }
}

var toastTimer;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}

/* ---------- render ----------------------------------------------------- */
function el(tag, cls, txt){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
var CROSS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>';
var RATINGS = [
  ['blanked',   'Blanked',   'start over'],
  ['struggled', 'Struggled', 'small step'],
  ['easy',      'Easy',      'push it out']
];

// Notes may contain a URL. Link it, but build the node with textContent so a
// pasted string can never become markup.
function notesNode(text){
  var box = el('p', 'notes');
  var re = /(https?:\/\/[^\s]+)/g, last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) box.appendChild(document.createTextNode(text.slice(last, m.index)));
    var a = el('a', null, m[1]);
    a.href = m[1];
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    box.appendChild(a);
    last = m.index + m[1].length;
  }
  if (last < text.length) box.appendChild(document.createTextNode(text.slice(last)));
  return box;
}

function render(){
  var today = iso(new Date());
  var s = summarize(topics, today);
  app.innerHTML = '';

  document.getElementById('stats').innerHTML =
    '<b>' + s.total + '</b> ' + (s.total === 1 ? 'topic' : 'topics') +
    ', <b>' + s.dueCount + '</b> due today' +
    (s.streak ? ', <b>' + plural(s.streak, 'day', 'days') + '</b> running' : '') + '.';

  var head = el('div', 'due-head');
  head.appendChild(el('h2', null, 'Due today'));
  if (s.reviewsToday) head.appendChild(el('span', 'n', plural(s.reviewsToday, 'review', 'reviews') + ' done'));
  app.appendChild(head);

  if (!s.dueCount){
    var e = el('div', 'empty');
    if (!s.total){
      e.appendChild(el('b', null, 'Nothing to review yet'));
      e.appendChild(el('p', null,
        'Add something you have just learned. It comes back tomorrow, then at ' +
        'widening gaps as you recall it — 1 day, 3, 8, 20, and on.'));
    } else {
      e.appendChild(el('b', null, 'Nothing due today'));
      e.appendChild(el('p', null, s.nextUp
        ? 'Next up is “' + s.nextUp.topic + '” ' + relDue(s.nextUp.nextDue, today) + '.'
        : 'Everything is scheduled ahead.'));
    }
    app.appendChild(e);
  } else {
    var cards = el('div', 'cards');
    s.due.forEach(function(t){
      var c = el('div', 'card');
      c.appendChild(el('div', 'name', t.topic));

      var seen = (t.reviews || []).length;
      var meta = 'Due ' + relDue(t.nextDue, today) + ' · interval ' +
                 plural(t.interval, 'day', 'days') + ' · ' +
                 (seen ? plural(seen, 'review', 'reviews') : 'never reviewed');
      c.appendChild(el('div', 'meta', meta));

      if (t.notes) c.appendChild(notesNode(t.notes));

      var rate = el('div', 'rate');
      RATINGS.forEach(function(r){
        var b = el('button');
        b.type = 'button';
        b.dataset.rate = r[0];
        b.dataset.id = t.id;
        b.appendChild(document.createTextNode(r[1]));
        b.appendChild(el('span', null, r[2] + ' · ' +
          plural(nextInterval(t.interval, r[0]), 'day', 'days')));
        rate.appendChild(b);
      });
      c.appendChild(rate);
      cards.appendChild(c);
    });
    app.appendChild(cards);
  }

  renderAll(today);
}

function renderAll(today){
  var all = document.getElementById('all');
  all.innerHTML = '';
  if (!topics.length) return;

  all.appendChild(el('h2', null, 'All topics'));

  var scroll = el('div', 'scroll'), table = el('table');
  var thead = el('thead'), hr = el('tr');
  ['Topic', 'Next due', 'Interval', 'Reviews', ''].forEach(function(h){
    hr.appendChild(el('th', null, h));
  });
  thead.appendChild(hr);
  table.appendChild(thead);

  var tbody = el('tbody');
  topics.slice().sort(function(a, b){ return dayNum(a.nextDue) - dayNum(b.nextDue); })
    .forEach(function(t){
      var tr = el('tr');
      tr.appendChild(el('td', 'topic', t.topic));

      var due = el('td', 'when' + (isDue(t, today) ? ' now' : ''), relDue(t.nextDue, today));
      due.title = t.nextDue;
      tr.appendChild(due);

      tr.appendChild(el('td', 'num', plural(t.interval, 'day', 'days')));
      tr.appendChild(el('td', 'num', String((t.reviews || []).length)));

      var last = el('td', 'num');
      var d = el('button', 'del');
      d.type = 'button';
      d.dataset.del = t.id;
      d.setAttribute('aria-label', 'Delete topic: ' + t.topic);
      d.innerHTML = CROSS;
      last.appendChild(d);
      tr.appendChild(last);
      tbody.appendChild(tr);
    });
  table.appendChild(tbody);
  scroll.appendChild(table);
  all.appendChild(scroll);

  var foot = el('div', 'foot');
  foot.appendChild(el('span', null, 'Saved on this device'));
  foot.appendChild(el('span', 'sp'));
  ['Export', 'Import'].forEach(function(t){
    var b = el('button', 'btn', t);
    b.type = 'button';
    b.id = t.toLowerCase();
    foot.appendChild(b);
  });
  all.appendChild(foot);
}

/* ---------- events ----------------------------------------------------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-rate],[data-del],#export,#import');
  if (!t) return;

  if (t.dataset.rate){
    var today = iso(new Date());
    var i = topics.findIndex(function(x){ return x.id === t.dataset.id; });
    if (i < 0) return;
    var before = topics[i].interval;
    topics[i] = applyReview(topics[i], t.dataset.rate, today);
    save(); render();
    toast(topics[i].topic + ' — back in ' + plural(topics[i].interval, 'day', 'days') +
          (topics[i].interval < before ? ' (reset)' : ''));
  }
  else if (t.dataset.del){
    var x = topics.find(function(y){ return y.id === t.dataset.del; });
    if (!x || !confirm('Delete “' + x.topic + '” and its review history?')) return;
    topics = topics.filter(function(y){ return y.id !== x.id; });
    save(); render();
    toast('Deleted “' + x.topic + '”');
  }
  else if (t.id === 'export') exportBackup();
  else if (t.id === 'import') document.getElementById('file').click();
});

document.getElementById('add').addEventListener('submit', function(e){
  e.preventDefault();
  var f = this.elements;
  var name = f.topic.value.trim();
  if (!name) return;
  topics.push(newTopic(name, f.notes.value.trim(), iso(new Date()),
    'r' + Date.now().toString(36)));
  f.topic.value = '';
  f.notes.value = '';
  f.topic.focus();
  save(); render();
  toast('“' + name + '” — first review tomorrow');
});

/* ---------- backup ------------------------------------------------------ */
function exportBackup(){
  var a = el('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(topics, null, 2)],
    {type: 'application/json'}));
  a.download = 'review-' + iso(new Date()) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Backup downloaded');
}

var file = el('input');
file.type = 'file';
file.id = 'file';
file.accept = 'application/json,.json';
file.hidden = true;
document.body.appendChild(file);
file.addEventListener('change', function(){
  var f = this.files[0];
  this.value = '';
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var s = JSON.parse(r.result);
      if (!Array.isArray(s) || (s.length && !s[0].nextDue)) throw new Error('not a Review backup');
      if (!confirm('Replace ' + plural(topics.length, 'topic', 'topics') +
                   ' with ' + plural(s.length, 'topic', 'topics') + ' from this file?')) return;
      topics = s;
      save(); render();
      toast('Backup restored');
    } catch (err){ toast('Import failed — ' + err.message); }
  };
  r.readAsText(f);
});

/* ---------- theme ------------------------------------------------------- */
var SUN = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.3 4.3l1.6 1.6' +
  'M18.1 18.1l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/>';
var MOON = '<path d="M20 14.3A8.4 8.4 0 1 1 9.7 4a6.6 6.6 0 0 0 10.3 10.3z"/>';

function applyTheme(){
  var t = localStorage.getItem(THEME_KEY);      // shared with the habit tracker
  if (t) document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.getElementById('theme-icon').innerHTML = dark ? SUN : MOON;
  document.getElementById('theme').setAttribute('aria-label',
    'Switch to ' + (dark ? 'light' : 'dark') + ' theme');
}
document.getElementById('theme').onclick = function(){
  var dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  try { localStorage.setItem(THEME_KEY, dark ? 'light' : 'dark'); } catch (e) {}
  applyTheme();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

applyTheme();
render();
</script>
</html>
